# MCP Server Helm Chart Values
# Deploy a single MCP server

# Server identity
name: "my-mcp-server"
version: "1.0.0"

# Container image
image:
  repository: "myorg/my-mcp-server"
  tag: "latest"
  pullPolicy: IfNotPresent
  pullSecrets: []

# Transport configuration
transport:
  type: "websocket"  # stdio, http-sse, websocket, grpc
  port: 3000
  host: "0.0.0.0"
  # TLS configuration (for websocket/http-sse)
  tls:
    enabled: false
    secretName: ""
    certFile: ""
    keyFile: ""

# MCP Capabilities
capabilities:
  tools:
    listChanged: true
  resources:
    subscribe: true
    listChanged: false
  prompts:
    listChanged: true
  logging:
    level: "info"

# Replica configuration
replicas: 3

# Resource limits
resources:
  limits:
    cpu: "2000m"
    memory: "4Gi"
  requests:
    cpu: "500m"
    memory: "1Gi"

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilization: 70
  targetMemoryUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

# Multi-tenancy
multiTenancy:
  enabled: false
  isolation: "namespace"  # namespace, network, full
  quotas:
    requestsPerMinute: 1000
    concurrentConnections: 100

# Environment variables
env: []
  # - name: "DATABASE_URL"
  #   value: "postgresql://user:pass@db:5432/mcp"
  # - name: "LOG_LEVEL"
  #   value: "info"

# Environment variables from secrets/configmaps
envFrom: []
  # - secretRef:
  #     name: "my-server-secrets"
  # - configMapRef:
  #     name: "my-server-config"

# Secrets to mount
secrets: []
  # - name: "my-server-secrets"
  #   mountPath: "/secrets"
  #   readOnly: true

# ConfigMaps to mount
configMaps: []
  # - name: "my-server-config"
  #   mountPath: "/config"
  #   readOnly: true

# Service configuration
service:
  enabled: true
  type: ClusterIP  # ClusterIP, NodePort, LoadBalancer
  ports:
    - name: mcp
      port: 3000
      targetPort: 3000
      protocol: TCP
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/websocket-services: "true"
  hosts:
    - host: "mcp.example.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: "mcp-server-tls"
      hosts:
        - "mcp.example.com"

# Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod Security
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: "RuntimeDefault"

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

# Pod labels
podLabels: {}

# Affinity and tolerations
affinity: {}
tolerations: []

# Node selector
nodeSelector: {}

# Priority class
priorityClassName: ""

# Liveness and readiness probes
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /ready
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Startup probe (for slow-starting containers)
startupProbe:
  enabled: false
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

# HorizontalPodAutoscaler
hpa:
  enabled: true
  behavior: {}

# Prometheus ServiceMonitor
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Network policy
networkPolicy:
  enabled: false
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: mcp-system
      ports:
        - protocol: TCP
          port: 3000

# Additional volumes
volumes: []
volumeMounts: []

# Init containers
initContainers: []

# Sidecar containers
sidecars: []

# Lifecycle hooks
lifecycle: {}
  # postStart:
  #   exec:
  #     command: ["/bin/sh", "-c", "echo 'Server started'"]
  # preStop:
  #   exec:
  #     command: ["/bin/sh", "-c", "sleep 10"]

# Revision history limit
revisionHistoryLimit: 10

# Strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%