apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpservers.mcp.platform
spec:
  group: mcp.platform
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 3
                image:
                  type: string
                transport:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: ["stdio", "http-sse", "websocket", "grpc"]
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    host:
                      type: string
                  required: ["type"]
                capabilities:
                  type: object
                  properties:
                    tools:
                      type: object
                      properties:
                        listChanged:
                          type: boolean
                    resources:
                      type: object
                      properties:
                        subscribe:
                          type: boolean
                        listChanged:
                          type: boolean
                    prompts:
                      type: object
                      properties:
                        listChanged:
                          type: boolean
                    logging:
                      type: object
                resources:
                  type: object
                  properties:
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                autoscaling:
                  type: object
                  properties:
                    minReplicas:
                      type: integer
                      minimum: 1
                    maxReplicas:
                      type: integer
                      minimum: 1
                    targetCPUUtilization:
                      type: integer
                      minimum: 1
                      maximum: 100
                multiTenancy:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    isolation:
                      type: string
                      enum: ["namespace", "network", "full"]
                    quotas:
                      type: object
                      properties:
                        requestsPerMinute:
                          type: integer
                        concurrentConnections:
                          type: integer
                env:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      valueFrom:
                        type: object
                secrets:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      mountPath:
                        type: string
                serviceAccount:
                  type: string
                ingress:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    className:
                      type: string
                    annotations:
                      type: object
                    hosts:
                      type: array
                      items:
                        type: object
                        properties:
                          host:
                            type: string
                          paths:
                            type: array
                            items:
                              type: object
                              properties:
                                path:
                                  type: string
                                pathType:
                                  type: string
              required: ["image"]
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Running", "Failed", "Unknown"]
                replicas:
                  type: integer
                readyReplicas:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                observedGeneration:
                  type: integer
  scope: Namespaced
  names:
    plural: mcpservers
    singular: mcpserver
    kind: MCPServer
    shortNames:
      - mcp
    categories:
      - mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-operator
  namespace: mcp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-operator
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["mcp.platform"]
    resources: ["mcpservers", "mcpservers/status", "mcpservers/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-operator
subjects:
  - kind: ServiceAccount
    name: mcp-operator
    namespace: mcp-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-operator
  namespace: mcp-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-operator
  template:
    metadata:
      labels:
        app: mcp-operator
    spec:
      serviceAccountName: mcp-operator
      containers:
        - name: operator
          image: ghcr.io/mcp/operator:v0.1.0
          args:
            - --leader-elect
            - --metrics-addr=:8080
            - --health-probe-addr=:8081
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi