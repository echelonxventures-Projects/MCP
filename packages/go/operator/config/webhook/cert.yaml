apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mcp-operator-webhook-cert
  namespace: mcp-system
spec:
  secretName: mcp-operator-webhook-server-cert
  issuerRef:
    name: mcp-operator-selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
    - mcp-operator-webhook-service.mcp-system.svc
    - mcp-operator-webhook-service.mcp-system.svc.cluster.local
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mcp-operator-selfsigned-issuer
spec:
  selfSigned: {}