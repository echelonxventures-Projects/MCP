[project]
name = "mcp-transports"
version = "0.1.0"
description = "MCP Transport Implementations for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp-types>=0.1.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]