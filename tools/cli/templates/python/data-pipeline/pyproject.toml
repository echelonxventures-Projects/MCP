[project]
name = "{{project_name}}"
version = "1.0.0"
description = "Data Pipeline MCP Server with ETL, orchestration, and data quality"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp-server>=0.1.0",
    "mcp-types>=0.1.0",
    "mcp-registry>=0.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.1.0",
    "apache-airflow>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
postgres = ["asyncpg>=0.29.0", "psycopg2-binary>=2.9.0"]
kafka = ["aiokafka>=0.8.0"]
s3 = ["aioboto3>=12.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"